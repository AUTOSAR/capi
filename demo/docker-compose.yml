# A file defining further services that are used during development (or possibly demonstration)
# That are intended to interact with the devcontainer
# E.g. a service realizing a second machine that is the communication counterpart of the machine under development.


networks:
  # The network used to connect different machines during development
  shared_network:
    name: capi_shared_network


services:

# A service to play the counterpart in the demo setup
  capi_demo:
    container_name: capi_demo
    build:
      context: ..
      dockerfile: demo/Dockerfile
      additional_contexts:
        capi_devcontainer: docker-image://capi-devcontainer-image:latest
    stdin_open: true
    tty: true
    networks:
      - shared_network
